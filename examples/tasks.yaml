objective: "Auditoria básica de ambiente e criação de artefato verificado"
steps:
  - id: step-1
    description: "Coletar metadados do sistema operacional"
    tool: system
    action: info
    params: {}
    verify:
      type: json_valid
      expected: true

  - id: step-2
    description: "Gerar arquivo de status de saúde"
    tool: filesystem
    action: write
    params:
      path: ".kernelis/health.txt"
      content: "kernelis-ok"
    verify:
      type: file_contains
      target: ".kernelis/health.txt"
      expected: "kernelis-ok"
